# lab.ponslink.com — permanent redirect to canonical blog (AdSense/SEO duplicate fix)
server {
    listen 80;
    listen [::]:80;
    server_name lab.ponslink.com;
    return 301 https://blog.ponslink.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lab.ponslink.com;

    ssl_certificate /etc/ssl/ponslink/ponslink.crt;
    ssl_certificate_key /etc/ssl/ponslink/ponslink.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://blog.ponslink.com$request_uri;
}
